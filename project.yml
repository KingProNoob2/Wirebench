name: Dirigo
options:
  bundleIdPrefix: com.dirigo
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ALWAYS_SEARCH_USER_PATHS: false

targets:
  DirigoCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DirigoCore
    settings:
      base:
        PRODUCT_NAME: DirigoCore
        DEFINES_MODULE: true
        SKIP_INSTALL: true

  DirigoLibrary:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DirigoLibrary
    dependencies:
      - target: DirigoCore
    settings:
      base:
        PRODUCT_NAME: DirigoLibrary
        DEFINES_MODULE: true
        SKIP_INSTALL: true

  # The C++ simulation core, built as its own static library. Its public header is plain C, so no
  # C++ interoperability mode is needed anywhere that imports it.
  DirigoSimCxx:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DirigoSimCxx
    settings:
      base:
        PRODUCT_NAME: DirigoSimCxx
        # SwiftPM works out the module for a C target on its own; Xcode does not. Without an explicit
        # module map `import DirigoSimCxx` fails in the app even though `swift test` builds it.
        DEFINES_MODULE: true
        MODULEMAP_FILE: $(SRCROOT)/Sources/DirigoSimCxx/include/module.modulemap
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/DirigoSimCxx/include
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        SKIP_INSTALL: true

  DirigoEngine:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DirigoEngine
    dependencies:
      - target: DirigoCore
      - target: DirigoLibrary
      - target: DirigoSimCxx
    settings:
      base:
        PRODUCT_NAME: DirigoEngine
        DEFINES_MODULE: true
        SKIP_INSTALL: true

  DirigoHardware:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DirigoHardware
    dependencies:
      - target: DirigoCore
      - target: DirigoLibrary
    settings:
      base:
        PRODUCT_NAME: DirigoHardware
        DEFINES_MODULE: true
        SKIP_INSTALL: true

  Dirigo:
    type: application
    platform: macOS
    sources:
      - path: Sources/DirigoApp
    dependencies:
      - target: DirigoCore
      - target: DirigoLibrary
      - target: DirigoEngine
      - target: DirigoHardware
    info:
      path: Info.plist
      properties:
        CFBundleExecutable: Dirigo
        CFBundleIdentifier: com.dirigo.DirigoApp
        CFBundleName: Dirigo
        CFBundleDisplayName: Dirigo
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PCC Project File"
            CFBundleTypeExtensions:
              - "pcc"
              - "xml"
            CFBundleTypeRole: "Editor"
            LSHandlerRank: "Default"
    settings:
      base:
        PRODUCT_NAME: Dirigo
        PRODUCT_BUNDLE_IDENTIFIER: com.dirigo.DirigoApp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # DirigoEngine embeds the C++ core; the linker needs the C++ runtime named for the app and the
        # CLI even though nothing in Swift mentions it.
        OTHER_LDFLAGS: -lc++

  DirigoCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DirigoCLI
    dependencies:
      - target: DirigoCore
      - target: DirigoLibrary
      - target: DirigoEngine
      - target: DirigoHardware
    settings:
      base:
        OTHER_LDFLAGS: -lc++
        PRODUCT_NAME: dirigo-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.dirigo.cli

  DirigoSwiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DirigoSwiftTests
    dependencies:
      - target: DirigoCore
      - target: DirigoLibrary
      - target: DirigoEngine
      - target: DirigoHardware
    settings:
      base:
        PRODUCT_NAME: DirigoSwiftTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  Dirigo:
    build:
      targets:
        Dirigo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DirigoSwiftTests
  DirigoCLI:
    build:
      targets:
        DirigoCLI: all
    run:
      config: Debug
